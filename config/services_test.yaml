services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\DataFixtures\:
        resource: '../src/DataFixtures/'

    App\DataFixtures\UserFixtures:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\DataFixtures\MediaAssetFixtures:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Tests\Support\FailingFacebookResponseFactory: ~

    facebook.http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        arguments:
            $responseFactory: '@App\Tests\Support\FailingFacebookResponseFactory'
            $baseUri: 'https://graph.facebook.com/'

    App\Service\Facebook\FacebookPublisher:
        public: true
        arguments:
            $httpClient: '@facebook.http_client'
            $facebookPageId: '1278125198721340'
            $facebookPageAccessToken: 'test-facebook-page-token'
            $apiVersion: 'v26.0'

    App\Tests\Support\FailingInstagramResponseFactory: ~

    instagram.http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        arguments:
            $responseFactory: '@App\Tests\Support\FailingInstagramResponseFactory'
            $baseUri: 'https://graph.instagram.com/'

    App\Service\Instagram\InstagramPublisher:
        public: true
        arguments:
            $httpClient: '@instagram.http_client'
            $instagramUserId: 'test-instagram-user'
            $instagramAccessToken: 'test-instagram-token'
            $pollAttempts: 2
            $pollDelayMilliseconds: 0
            $requestTimeoutSeconds: 1.0
            $apiBaseUrl: 'https://graph.instagram.com/'

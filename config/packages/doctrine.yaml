doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Messenger owns this durable transport table; it is intentionally not
        # mapped as a Doctrine ORM entity.
        schema_filter: '~^(?!(?:messenger_messages|lock_keys)$)~'

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
